<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Your VisiTrack visitor pass for Pamantasan ng Lungsod ng Maynila."
    />
    <title>Visitor pass | VisiTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./ticket.css" />
    <script src="./ticket.js" defer></script>
  </head>

  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="VisiTrack">
        <span class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Calendar with clock">
  <rect width="512" height="512" rx="94" fill="#3EBCA2"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="28">
      <path d="M188 401H157A30 30 0 0 1 127 371V155A30 30 0 0 1 157 125H355A30 30 0 0 1 385 155V187"/>
      <path d="M127 215H205"/>
      <path d="M199 109V144M314 109V144"/>
      <circle cx="314" cy="326" r="75"/>
    </g>
    <path stroke-width="22" d="M311 297V323L332 344"/>
  </g>
</svg>
        </span>

        <span class="brand-name">VisiTrack</span>
      </header>

      <main>
        <section class="ticket-intro" aria-labelledby="page-title">
          <h1 id="page-title">
            Welcome to<br />
            Pamantasan ng<br />
            Lungsod ng Maynila!
          </h1>

          <article class="ticket" aria-label="Visitor pass">
            <div class="ticket__header">
              <span class="ticket__label">Visitor pass</span>

              <span
                class="ticket__status ticket__status--checked-in"
                data-ticket-status
                aria-live="polite"
              >
                Checked-in
              </span>
            </div>

            <div class="ticket__divider" aria-hidden="true"></div>

            <div class="ticket__details">
              <p class="ticket__name" data-ticket-name>—</p>

              <p class="ticket__slot">
                ID Slot:
                <strong data-ticket-slot>—</strong>
              </p>
            </div>
          </article>

          <p class="ticket-instruction">
            Show this visitor pass to the desk staff before exiting to reclaim your ID.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
