<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Sign in to VisiTrack as an administrator or security staff member."
    >
    <title>VisiTrack | Staff Log-in</title>
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="LoginPage.css">
  </head>
  <body>
    <div class="login-shell">
      <header class="login-header">
        <a class="back-link" href="../../index.html" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5 8 12l7 7M8 12h12"></path>
          </svg>
        </a>
        <a class="brand" href="../../index.html" aria-label="VisiTrack home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="6" y="8" width="34" height="31" rx="5"></rect>
              <path d="M15 5v8M31 5v8M6 17h34"></path>
              <circle cx="32" cy="32" r="10" fill="#31b99e"></circle>
              <path d="M32 27v5l3.5 2.5"></path>
            </svg>
          </span>
          <span>VisiTrack</span>
        </a>
      </header>

      <main class="login-main">
        <section class="login-welcome" aria-labelledby="login-title">
          <h1 class="page-title" id="login-title">Admin Log-in</h1>
          <p class="page-subtitle" id="login-subtitle">
            Manage Users, Reports, and Audits.
          </p>
        </section>

        <nav class="role-tabs" aria-label="Choose staff log-in">
          <a class="role-tab" id="admin-tab" href="LoginPage.html?role=admin">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
            </svg>
            <span>Admin</span>
          </a>
          <a class="role-tab" id="security-tab" href="LoginPage.html?role=security">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Security</span>
          </a>
        </nav>

        <form class="login-form">
          <label class="login-field">
            <span id="identity-label">Admin ID or email</span>
            <input
              id="identity"
              name="identity"
              type="text"
              autocomplete="username"
              required
            >
          </label>

          <label class="login-field">
            <span>Password</span>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <div class="login-options">
            <label class="remember-option">
              <input type="checkbox" name="remember">
              <span>Keep me signed in</span>
            </label>
            <a class="forgot-link" href="#forgot-password">Forgot password?</a> <!--add forgot-password page once back-end is ready-->
          </div>

          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button class="login-submit" id="login-submit" type="submit">
            Log in as Admin
          </button>
        </form>

        <p class="login-notice">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
          </svg>
          <span>For authorized staff only. Activity on this system is recorded.</span>
        </p>
      </main>
    </div>

    <script>
      // Confirm these endpoints with the back-end developer.
      const API_URL = "/api/admin/login";
      const USE_MOCK = true;

      const role = new URLSearchParams(window.location.search).get("role");
      const isSecurity = role === "security";
      const REDIRECT_URL = isSecurity
        ? "../../SecurityDB/Front-End/SecurityDB.html"
        : "../../admin-dashboard/FRONTEND/dashboard.html";
      const activeTab = document.getElementById(
        isSecurity ? "security-tab" : "admin-tab"
      );
      const loginForm = document.querySelector(".login-form");
      const loginError = document.getElementById("login-error");
      const loginButton = document.getElementById("login-submit");

      document.title = `VisiTrack | ${isSecurity ? "Security" : "Admin"} Log-in`;
      document.getElementById("login-title").textContent =
        `${isSecurity ? "Security" : "Admin"} Log-in`;
      document.getElementById("login-subtitle").textContent = isSecurity
        ? "Check visitors in and out at the gate."
        : "Manage Users, Reports, and Audits.";
      document.getElementById("identity-label").textContent =
        `${isSecurity ? "Security" : "Admin"} ID or email`;
      loginButton.textContent =
        `Log in as ${isSecurity ? "Security" : "Admin"}`;
      const defaultButtonText = loginButton.textContent.trim();
      activeTab.classList.add("is-active");
      activeTab.setAttribute("aria-current", "page");

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginError.hidden = true;
        loginError.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
          const credentials = {
            identity: loginForm.elements.namedItem("identity").value,
            password: loginForm.elements.namedItem("password").value,
            remember: loginForm.elements.namedItem("remember").checked,
          };
          let response;

          if (USE_MOCK) { //mock login password to test login page without back-end
            await new Promise((resolve) => window.setTimeout(resolve, 800));
            response = {
              status: credentials.password === "test123" ? 200 : 401,
            };
          } else {
            response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify(credentials),
            });
          }

          if (response.status === 200) {
            window.location.assign(REDIRECT_URL);
          } else if (response.status === 401) {
            loginError.textContent = "Wrong ID/email or password.";
            loginError.hidden = false;
          } else if (response.status === 429) {
            loginError.textContent = "Too many attempts. Try again later.";
            loginError.hidden = false;
          } else {
            loginError.textContent = "Something went wrong. Please try again.";
            loginError.hidden = false;
          }
        } catch {
          loginError.textContent = "Something went wrong. Please try again.";
          loginError.hidden = false;
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = defaultButtonText;
        }
      });
    </script>
  </body>
</html>
